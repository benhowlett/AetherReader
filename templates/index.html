<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AetherReader</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind config to enable dark mode class
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body :class="{ 'dark': isDarkMode }" class="bg-white dark:bg-gray-900 text-black dark:text-white">
    {% raw %}
    <div id="app" class="container mx-auto p-4">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-2xl font-bold">AetherReader</h1>
            <button @click="toggleDarkMode" class="p-2 border rounded">
                {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
            </button>
        </header>

        <div v-if="!isLoggedIn">
            <button @click="loginWithPasskey" class="bg-blue-500 text-white px-4 py-2 rounded">
                Login with Passkey
            </button>
        </div>

        <div v-else>
            <p>Welcome back! Your library is loading...</p>
        </div>

        <div v-if="isLoggedIn" class="mt-8">
            <h2 class="text-xl font-semibold mb-4">Connect Your Primary Library</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <a href="/login/nextcloud" class="p-6 border-2 border-blue-500 rounded-lg hover:bg-blue-50 dark:hover:bg-gray-800 transition flex flex-col items-center">
                    <span class="text-3xl mb-2">☁️</span>
                    <span>Nextcloud</span>
                </a>

                <a href="/login/google" class="p-6 border rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition flex flex-col items-center">
                    <span class="text-3xl mb-2">📁</span>
                    <span>Google Drive</span>
                </a>

                <a href="/login/dropbox" class="p-6 border rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition flex flex-col items-center">
                    <span class="text-3xl mb-2">📦</span>
                    <span>Dropbox</span>
                </a>
            </div>
        </div>

        <div v-if="isConnected" class="mt-8 bg-gray-50 dark:bg-gray-800 p-6 rounded-xl shadow-inner">
            <h3 class="text-lg font-bold mb-4">Select your Library Folder</h3>
            
            <nav class="text-sm mb-4 text-blue-500">
                <span @click="navigateTo('/')" class="cursor-pointer hover:underline">Root</span>
                <span v-for="seg in currentPathSegments"> / {{ seg }}</span>
            </nav>

            <ul class="divide-y divide-gray-200 dark:divide-gray-700 border rounded-lg overflow-hidden">
                <li v-for="item in files" :key="item.path" 
                    @click="handleItemClick(item)"
                    class="p-4 hover:bg-white dark:hover:bg-gray-700 cursor-pointer flex justify-between items-center">
                    <div class="flex items-center">
                        <span class="mr-3">{{ item.is_folder ? '📁' : '📖' }}</span>
                        <span>{{ item.name }}</span>
                    </div>
                    <button v-if="item.is_folder" @click.stop="setAsLibrary(item)" class="text-xs bg-green-500 text-white px-2 py-1 rounded">
                        Select This Folder
                    </button>
                </li>
            </ul>
        </div>
        <div v-if="currentlyReading" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <button @click="closeReader" class="text-blue-500">← Back to Library</button>
                <span class="font-bold">{{ currentlyReading.name }}</span>
                <div class="space-x-4">
                    <button @click="prevPage">Prev</button>
                    <button @click="nextPage">Next</button>
                </div>
            </div>
            
            <div id="viewer" class="flex-grow overflow-hidden"></div>
        </div>
    </div>
    {% endraw %}

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    isDarkMode: true,
                    isLoggedIn: false,
                    isConnected: false,
                    files: [],
                    currentPathSegments: [],
                    currentlyReading: null,
                    rendition: null
                }
            },
            methods: {
                toggleDarkMode() {
                    this.isDarkMode = !this.isDarkMode;
                },
                async loginWithPasskey() {
                    const username = prompt("Enter a username:");
                    if (!username) return;
                    
                    try {
                        // 1. Get options from Flask
                        const response = await fetch('/generate-registration-options', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ username })
                        });
                        const options = await response.json();
                        console.log("Registration Options:", options);

                        // Convert base64url to Uint8Array for the browser
                        if (options.challenge) options.challenge = this.bufferDecode(options.challenge);
                        if (options.user && options.user.id) options.user.id = this.bufferDecode(options.user.id);
                        if (options.excludeCredentials) {
                            options.excludeCredentials.forEach(c => {
                                if (c.id) c.id = this.bufferDecode(c.id);
                            });
                        }

                        // 2. Create Credential
                        console.log("Calling navigator.credentials.create...");
                        const credential = await navigator.credentials.create({
                            publicKey: options
                        });
                        console.log("Credential created:", credential);

                        // 3. Send back to Flask to verify
                        const verifyResponse = await fetch('/verify-registration', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(this.credentialToJSON(credential))
                        });

                        const result = await verifyResponse.json();
                        if (verifyResponse.ok && result.status === 'success') {
                            alert("Registration successful!");
                            this.isLoggedIn = true;
                        } else {
                            alert("Registration failed: " + (result.message || "Unknown error"));
                        }
                    } catch (err) {
                        console.error("Passkey Error:", err);
                        alert("Error: " + err.message);
                    }
                },
                // Helpers for WebAuthn binary data
                bufferDecode(value) {
                    if (!value) return null;
                    return Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                },
                bufferEncode(value) {
                    return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                },
                credentialToJSON(cred) {
                    if (cred instanceof Array) {
                        return cred.map(c => this.credentialToJSON(c));
                    }
                    if (cred instanceof ArrayBuffer) {
                        return this.bufferEncode(cred);
                    }
                    if (cred instanceof Object) {
                        const obj = {};
                        for (let key in cred) {
                            obj[key] = this.credentialToJSON(cred[key]);
                        }
                        return obj;
                    }
                    return cred;
                },
                async fetchFiles(path = '/') {
                    const response = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
                    this.files = await response.json();
                },
                handleItemClick(item) {
                    if (item.is_folder) {
                        this.fetchFiles(item.path);
                    } else {
                        this.openBook(item);
                    }
                },
                async setAsLibrary(folder) {
                    const response = await fetch('/api/set-library', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ folder_id: folder.path })
                    });

                    if (response.ok) {
                        alert(`Success! AetherReader will now sync with: ${folder.name}`);
                        this.isConnected = true;
                    } else {
                        alert("Failed to set library folder.");
                    }
                },
                async openBook(item) {
                    this.currentlyReading = item;
                    const bookUrl = `/api/proxy-book?path=${encodeURIComponent(item.path)}`;
                    
                    if (item.name.endsWith('.epub')) {
                        this.rendition = ePub(bookUrl).renderTo("viewer", {
                            width: "100%",
                            height: "100%",
                            flow: "paginated"
                        });
                        
                        // Load saved progress from your SQLite DB
                        const savedLocation = await this.getSavedProgress(item.path);
                        this.rendition.display(savedLocation);

                        // Track progress as you read
                        this.rendition.on("relocated", (location) => {
                            this.saveProgress(item.path, location.start.cfi);
                        });
                    }
                },
                closeReader() {
                    if (this.rendition) this.rendition.destroy();
                    this.currentlyReading = null;
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
