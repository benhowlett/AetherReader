<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AetherReader</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind config to enable dark mode class
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body :class="{ 'dark': isDarkMode }" class="bg-white dark:bg-gray-900 text-black dark:text-white">
    <div id="app" class="container mx-auto p-4">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-2xl font-bold">AetherReader</h1>
            <button @click="toggleDarkMode" class="p-2 border rounded">
                {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
            </button>
        </header>

        <div v-if="!isLoggedIn">
            <button @click="loginWithPasskey" class="bg-blue-500 text-white px-4 py-2 rounded">
                Login with Passkey
            </button>
        </div>

        <div v-else>
            <p>Welcome back! Your library is loading...</p>
        </div>

        <div v-if="isLoggedIn" class="mt-8">
            <h2 class="text-xl font-semibold mb-4">Connect Your Primary Library</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <a href="/login/nextcloud" class="p-6 border-2 border-blue-500 rounded-lg hover:bg-blue-50 dark:hover:bg-gray-800 transition flex flex-col items-center">
                    <span class="text-3xl mb-2">☁️</span>
                    <span>Nextcloud</span>
                </a>

                <a href="/login/google" class="p-6 border rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition flex flex-col items-center">
                    <span class="text-3xl mb-2">📁</span>
                    <span>Google Drive</span>
                </a>

                <a href="/login/dropbox" class="p-6 border rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition flex flex-col items-center">
                    <span class="text-3xl mb-2">📦</span>
                    <span>Dropbox</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    isDarkMode: true, // Native dark mode preferred 
                    isLoggedIn: false
                }
            },
            methods: {
                toggleDarkMode() {
                    this.isDarkMode = !this.isDarkMode;
                },
                async loginWithPasskey() {
                    const username = prompt("Enter a username:");
                    
                    // 1. Get options from our Flask server
                    const response = await fetch('/generate-registration-options', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ username })
                    });
                    const options = await response.json();

                    // 2. Trigger the native Mac/browser Passkey prompt
                    // This will pop up the Touch ID / Password prompt on your Mac
                    const credential = await navigator.credentials.create({
                        publicKey: options
                    });

                    // 3. Send the result back to Flask to verify and save
                    console.log("Credential created:", credential);
                    alert("Passkey generated on your device!");
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
